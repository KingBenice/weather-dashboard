<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <h1><i class="fas fa-cloud-sun"></i> Weather Dashboard</h1>
        <div class="header-controls">
          <button id="geoBtn" class="btn-geo" title="Get current location">
            <i class="fas fa-map-marker-alt"></i> My Location
          </button>
          <button id="themeToggle" class="btn-theme">
            <i class="fas fa-moon"></i>
          </button>
          <select id="tempUnit" class="temp-unit">
            <option value="metric">°C</option>
            <option value="imperial">°F</option>
          </select>
        </div>
      </div>
    </header>

    <!-- Search Section -->
    <section class="search-section">
      <div class="search-container">
        <input
          type="text"
          id="searchInput"
          placeholder="Search for a city..."
          class="search-input"
        />
        <button id="searchBtn" class="btn-search">
          <i class="fas fa-search"></i> Search
        </button>
      </div>
      <div id="favoritesList" class="favorites-list"></div>
    </section>

    <!-- Error Message -->
    <div id="errorMessage" class="error-message"></div>

    <!-- Current Weather -->
    <section id="currentWeather" class="current-weather hidden">
      <div class="weather-card">
        <div class="weather-header">
          <div class="city-info">
            <h2 id="cityName"></h2>
            <p id="weatherDate"></p>
          </div>
          <div class="temp-section">
            <div id="tempDisplay" class="temp-display"></div>
            <div id="weatherIcon" class="weather-icon"></div>
          </div>
        </div>
        <p id="weatherDescription" class="weather-desc"></p>
        <div class="weather-details">
          <div class="detail">
            <span class="detail-label">Feels Like</span>
            <span id="feelsLike" class="detail-value"></span>
          </div>
          <div class="detail">
            <span class="detail-label">Humidity</span>
            <span id="humidity" class="detail-value"></span>
          </div>
          <div class="detail">
            <span class="detail-label">Wind Speed</span>
            <span id="windSpeed" class="detail-value"></span>
          </div>
          <div class="detail">
            <span class="detail-label">Pressure</span>
            <span id="pressure" class="detail-value"></span>
          </div>
          <div class="detail">
            <span class="detail-label">UV Index</span>
            <span id="uvIndex" class="detail-value"></span>
          </div>
          <div class="detail">
            <span class="detail-label">Visibility</span>
            <span id="visibility" class="detail-value"></span>
          </div>
        </div>
        <button id="addFavorite" class="btn-favorite">
          <i class="fas fa-heart"></i> Add to Favorites
        </button>
      </div>
    </section>

    <!-- 5-Day Forecast -->
    <section id="forecastSection" class="forecast-section hidden">
      <h3>5-Day Forecast</h3>
      <div id="forecastCards" class="forecast-cards"></div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
